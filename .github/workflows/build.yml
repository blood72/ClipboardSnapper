name: Build Windows x64

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      PROJECT: ClipboardSnapper/ClipboardSnapper.csproj

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Restore locked dependencies
        run: |
          dotnet restore $env:PROJECT --locked-mode -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore tests/Contracts/Contracts.csproj --locked-mode

      - name: Verify naming, preferences, history races and real JPEG encoder
        run: dotnet run --project tests/Contracts/Contracts.csproj --framework net10.0-windows10.0.26100.0 --configuration Release --no-restore

      - name: Build Release
        run: dotnet build $env:PROJECT --configuration Release --no-restore -p:Platform=x64

      - name: Publish self-contained folder
        run: dotnet publish $env:PROJECT --configuration Release --no-restore -p:Platform=x64 --output artifacts/publish

      - name: Bundle Visual C++ runtime
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual C++ build tools are missing.' }
          $redist = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT" -Directory |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $redist) { throw 'Visual C++ x64 redistributable files are missing.' }
          Copy-Item "$($redist.FullName)\*.dll" artifacts/publish
          Get-ChildItem "$($redist.FullName)\*.dll" | Select-Object Name, @{Name='Version'; Expression={$_.VersionInfo.FileVersion}}

      - name: Verify publish contents and smoke test
        run: |
          trap {
            Write-Output "::error::$($_.Exception.Message)"
            exit 1
          }
          $publish = (Resolve-Path artifacts/publish).Path
          Write-Output "::notice::Published PRI files: $((Get-ChildItem $publish -Filter *.pri).Name -join ', ')"
          $required = @(
            'ClipboardSnapper.exe', 'ClipboardSnapper.dll',
            'lang/en.json', 'lang/ko.json',
            'ClipboardSnapper.deps.json', 'ClipboardSnapper.runtimeconfig.json',
            'coreclr.dll', 'hostfxr.dll', 'hostpolicy.dll', 'System.Private.CoreLib.dll',
            'Microsoft.UI.Xaml.dll', 'Microsoft.UI.Xaml.Controls.pri', 'ClipboardSnapper.pri',
            'vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll'
          )
          foreach ($file in $required) {
            if (-not (Test-Path (Join-Path $publish $file))) { throw "Missing publish file: $file" }
          }
          $runtime = Get-Content "$publish/ClipboardSnapper.runtimeconfig.json" -Raw | ConvertFrom-Json
          if ($runtime.runtimeOptions.framework -or $runtime.runtimeOptions.frameworks) {
            throw 'The .NET runtime configuration is framework-dependent.'
          }
          $process = Start-Process "$publish/ClipboardSnapper.exe" -WorkingDirectory $publish -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(30)
            do {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited) { throw "App exited during startup: $($process.ExitCode)" }
            } while ($process.MainWindowHandle -eq 0 -and (Get-Date) -lt $deadline)
            if ($process.MainWindowHandle -eq 0) { throw 'The app did not create a main window handle.' }
            if ($process.MainWindowTitle -ne 'ClipboardSnapper') { throw "Unexpected window title: $($process.MainWindowTitle)" }
            foreach ($name in @('coreclr.dll', 'Microsoft.UI.Xaml.dll')) {
              $module = $process.Modules | Where-Object ModuleName -eq $name | Select-Object -First 1
              if (-not $module -or $module.FileName -ne (Join-Path $publish $name)) {
                throw "Runtime module was not loaded from the publish folder: $name"
              }
            }
            Write-Output "::notice::Process startup, window handle/title, and app-local .NET/WinUI modules verified: $($process.MainWindowTitle)."
            Write-Output 'Actual on-screen visibility and clean-PC execution require manual verification.'
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id }
          }

      - name: Verify clipboard saving and feature states
        run: powershell.exe -NoProfile -STA -File tests/FeatureSmoke.ps1 -PublishPath artifacts/publish

      - name: Upload complete publish folder
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ClipboardSnapper-win-x64
          path: artifacts/publish/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Download uploaded artifact for verification
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ClipboardSnapper-win-x64
          path: artifacts/downloaded

      - name: Verify every artifact file
        run: |
          $source = (Resolve-Path artifacts/publish).Path
          $download = (Resolve-Path artifacts/downloaded).Path
          $files = @(Get-ChildItem $source -Recurse -File -Force)
          $downloaded = @(Get-ChildItem $download -Recurse -File -Force)
          if ($files.Count -ne $downloaded.Count) { throw 'Artifact file count does not match publish output.' }
          foreach ($file in $files) {
            $relative = [IO.Path]::GetRelativePath($source, $file.FullName)
            $copy = Join-Path $download $relative
            if (-not (Test-Path $copy -PathType Leaf)) { throw "Missing artifact file: $relative" }
            if ((Get-FileHash $file.FullName -Algorithm SHA256).Hash -ne (Get-FileHash $copy -Algorithm SHA256).Hash) {
              throw "Artifact file hash mismatch: $relative"
            }
          }
          Write-Output "::notice::Artifact verified: $($files.Count) files; all paths and SHA-256 hashes match the publish folder."
