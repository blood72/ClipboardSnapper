name: Refresh single-file lock metadata
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json
      - name: Generate lock using the pinned SDK and normal NuGet verification
        shell: pwsh
        run: |
          dotnet restore ClipboardSnapper/ClipboardSnapper.csproj --force-evaluate -p:Platform=x64 -p:PublishSingleFile=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content ClipboardSnapper/packages.lock.json
